<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acties | Hope for Dogs</title>
  <meta name="description" content="Doe mee met onze acties: koop een lot, bestel onze kalender of steun een inzameling. Elke bijdrage helpt straathonden in Bosnië en Servië.">
  <link rel="canonical" href="https://www.hopefordogseurope.com/acties.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hope for Dogs">
  <meta property="og:title" content="Acties | Hope for Dogs">
  <meta property="og:description" content="Doe mee met onze acties en steun straathonden in Bosnië en Servië.">
  <meta property="og:url" content="https://www.hopefordogseurope.com/acties.html">
  <meta property="og:image" content="https://www.hopefordogseurope.com/images/hero-1.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Nunito:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=21">
  <style>
    img { max-width: 100%; display: block; }

    /* ===== HEADER — same text style as the adoption page hero ===== */
    .acties-hero {
      width: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
    }
    .acties-hero-inner {
      width: 100%;
      max-width: 1480px;
      padding: 184px 0 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 0.5px solid #d6d6d6;
    }
    .acties-hero-text {
      width: 752px;
      max-width: 100%;
      padding: 0 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 19px;
    }
    .acties-hero-text h1 { font-weight: 900; color: #362709; }

    /* ===== GRID ===== */
    .acties-page { width: 100%; background: #fff; display: flex; justify-content: center; }
    .acties-page-inner { width: 100%; max-width: 1240px; padding: 56px 40px 96px; }
    .acties-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .actie-card {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      padding: 14px 14px 18px;
      transition: box-shadow 0.25s ease;
    }
    .actie-card:hover { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10); }
    .actie-card-media { width: 100%; border-radius: 14px; overflow: hidden; background: #eee; }
    .actie-card-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .actie-card:hover .actie-card-img { transform: scale(1.05); }
    .actie-card-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: #181818; margin: 16px 2px 6px; }
    .actie-card-desc {
      font-family: 'Manrope', sans-serif;
      font-size: 15px;
      font-weight: 500;
      line-height: 22px;
      color: #6e6e6e;
      margin: 0 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .acties-empty { grid-column: 1 / -1; text-align: center; color: #6e6e6e; padding: 60px 20px; font-family: 'Manrope', sans-serif; font-size: 16px; }

    @media (max-width: 900px) {
      .acties-hero-inner { padding: 150px 0 40px; }
      .acties-page-inner { padding: 40px 20px 72px; }
      .acties-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
    }
    @media (max-width: 560px) {
      .acties-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <main>
    <section class="acties-hero">
      <div class="acties-hero-inner">
        <div class="acties-hero-text">
          <h1 class="t-heading-lg" data-i18n="acties.hero">Onze acties</h1>
          <p class="t-body-lg" data-i18n="acties.hero.sub">We organiseren regelmatig leuke acties om onze dieren en onze opvang te steunen. Doe jij ook mee?</p>
        </div>
      </div>
    </section>

    <section class="acties-page">
      <div class="acties-page-inner">
        <div class="acties-grid" id="actiesGrid"></div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="supabase-config.js"></script>
  <script src="components.js?v=43"></script>
  <script>
    (function () {
      function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
      function loc(row, field) {
        var lang = (typeof h4dGetLanguage === 'function') ? h4dGetLanguage() : 'nl';
        return (row && (row[field + '_' + lang] || row[field + '_nl'])) || '';
      }
      function emptyMsg() { return (typeof h4dT === 'function') ? h4dT('acties.empty') : 'Er zijn op dit moment geen acties. Kom snel terug!'; }
      function cardHTML(r) {
        var img = (Array.isArray(r.gallery_images) && r.gallery_images[0]) || r.image_url || r.prize_image_url || 'lolo.png';
        return '<button type="button" class="actie-card" data-id="' + r.id + '" data-type="' + esc(r.type || '') + '">' +
          '<span class="actie-card-media"><img class="actie-card-img" src="' + esc(img) + '" alt="" loading="lazy"></span>' +
          '<span class="actie-card-title">' + esc(loc(r, 'title') || 'Actie') + '</span>' +
          '<span class="actie-card-desc">' + esc(loc(r, 'description') || '') + '</span>' +
        '</button>';
      }
      async function load() {
        var grid = document.getElementById('actiesGrid');
        try {
          var rows = await supabaseGet('lotteries', 'select=*&visible=eq.true&order=featured.desc,created_at.desc');
          if (!rows || !rows.length) { grid.innerHTML = '<div class="acties-empty">' + esc(emptyMsg()) + '</div>'; return; }
          grid.innerHTML = rows.map(cardHTML).join('');
          grid.querySelectorAll('.actie-card').forEach(function (card) {
            card.addEventListener('click', function () {
              var id = card.getAttribute('data-id'), type = card.getAttribute('data-type');
              if (type === 'product' && window.openActieModal) window.openActieModal(id);
              else if (window.openLotteryModal) window.openLotteryModal(id);
            });
          });
        } catch (e) {
          grid.innerHTML = '<div class="acties-empty">' + esc(emptyMsg()) + '</div>';
        }
      }
      load();
    })();
  </script>
</body>
</html>
