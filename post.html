<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nieuws | Hope for Dogs</title>
  <meta name="description" content="Lees dit nieuwsbericht van Hope for Dogs over onze reddingsacties en het leven in het asiel.">
  <link rel="canonical" href="https://www.hopefordogseurope.com/post.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Hope for Dogs">
  <meta property="og:title" content="Nieuws | Hope for Dogs">
  <meta property="og:description" content="Lees dit nieuwsbericht van Hope for Dogs over onze reddingsacties en het leven in het asiel.">
  <meta property="og:url" content="https://www.hopefordogseurope.com/post.html">
  <meta property="og:image" content="https://www.hopefordogseurope.com/images/hero-1.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Nunito:wght@400;500;600;700;800;900&amp;family=Besley:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=21">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      color: var(--dark-1);
      background: var(--white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ========== LAYOUT ========== */
    .post-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 112px 40px 80px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--dark-2);
      margin-bottom: 40px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--brand); }
    .back-link svg { width: 16px; height: 16px; }

    .post-date {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark-2);
      margin-bottom: 12px;
    }

    .post-title {
      margin-bottom: 24px;
    }

    .post-hero-img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      margin-bottom: 40px;
      background: var(--beige);
    }

    .post-content {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.75;
      color: var(--dark-1);
      letter-spacing: 0.01em;
    }

    /* Plain text posts (no HTML) */
    .post-content.plain-text {
      white-space: pre-line;
    }

    /* Rich HTML content styling */
    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4,
    .post-content h5,
    .post-content h6 {
      font-family: 'Nunito', sans-serif;
      color: var(--dark-1);
      text-transform: none;
    }
    .post-content h1 { font-size: 34px; font-weight: 800; margin: 48px 0 18px; line-height: 1.2; }
    .post-content h2 {
      font-size: 30px;
      font-weight: 800;
      margin: 48px 0 18px;
      line-height: 1.25;
    }
    /* First heading sits flush under the hero image */
    .post-content > h2:first-child { margin-top: 0; }
    .post-content h3 { font-size: 22px; font-weight: 800; margin: 36px 0 12px; line-height: 1.35; }
    .post-content h4 { font-size: 19px; font-weight: 700; margin: 28px 0 8px; line-height: 1.4; }
    .post-content h5,
    .post-content h6 { font-size: 17px; font-weight: 700; margin: 22px 0 8px; line-height: 1.5; }

    .post-content p { margin: 0 0 22px; }

    .post-content ul,
    .post-content ol { margin: 0 0 22px; padding-left: 26px; }
    .post-content ul { list-style: disc; }
    .post-content ol { list-style: decimal; }
    .post-content li { margin-bottom: 10px; padding-left: 4px; line-height: 1.7; }
    .post-content li::marker { color: var(--dark-2); }
    /* Bold label at start of a list item / paragraph reads as a mini-heading */
    .post-content li > strong:first-child,
    .post-content p > strong:first-child { color: var(--dark-1); }

    .post-content strong { font-weight: 700; color: var(--dark-1); }
    .post-content em { font-style: italic; }

    .post-content a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .post-content a:hover { opacity: 0.8; }

    .post-content blockquote {
      border-left: 3px solid rgba(26, 26, 26, 0.15);
      padding: 4px 0 4px 22px;
      margin: 28px 0;
      color: var(--dark-2);
      font-family: 'Besley', Georgia, serif;
      font-size: 24px;
      line-height: 1.5;
      font-style: italic;
    }
    .post-content blockquote > :first-child { margin-top: 0; }
    .post-content blockquote > :last-child { margin-bottom: 0; }
    /* A bold first line inside a quote acts as its heading */
    .post-content blockquote strong,
    .post-content blockquote b { color: var(--dark-1); font-weight: 700; }

    .post-content hr {
      border: none;
      border-top: 1px solid rgba(26, 26, 26, 0.12);
      margin: 44px 0;
    }

    .post-content img {
      border-radius: 14px;
      margin: 28px 0;
    }

    /* ========== LOADING / ERROR ========== */
    .loading-screen, .error-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0,0,0,0.1);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- SM: 768–1023px --- */
    @media (max-width: 1023px) {
      /* Responsive type */
      .post-content { font-size: 17px; }
      .post-content h2 { font-size: 26px; margin-top: 40px; }
      .post-content h3 { font-size: 20px; }

      .post-section { padding: 144px 40px 80px; }
    }

    /* --- XS: 0–767px --- */
    @media (max-width: 767px) {
      /* Responsive type — XS */
      .post-content { font-size: 16px; line-height: 1.7; }
      .post-content h2 { font-size: 24px; margin: 36px 0 14px; }
      .post-content h3 { font-size: 19px; }
      .post-content p { margin: 0 0 18px; }
      .post-content blockquote { font-size: 20px; }
      .post-section { padding: 144px 20px 60px; }
    }

    /* The "Lees ook" stories and the help CTA both break out wider than the text
       column (which is max-width 800px) so they line up and have room on one row. */
    #relatedPosts, .post-cta {
      width: min(92vw, 920px);
      margin-left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
    }
    .post-cta {
      margin-top: 48px;
      padding: 32px;
      background: #faf8f4;
      border-radius: 16px;
      text-align: center;
    }
    .post-cta-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: nowrap; }
    @media (max-width: 640px) {
      #relatedPosts, .post-cta { width: 100%; margin-left: 0; transform: none; }
      .post-cta-actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>

  <main>
  <!-- Loading -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <span style="color:var(--dark-2);font-size:15px;" data-i18n="dogs.loading">Laden&hellip;</span>
  </div>

  <!-- Error -->
  <div class="error-screen" id="errorScreen" style="display:none;">
    <h2 data-i18n="blog.notfoundTitle">Bericht niet gevonden</h2>
    <p data-i18n="blog.notfound">Dit nieuwsbericht bestaat niet of is verwijderd.</p>
    <a href="nieuws.html" class="btn-primary" data-i18n="blog.back">Terug naar nieuws</a>
  </div>

  <!-- Post Detail -->
  <section class="post-section" id="postSection" style="display:none;">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep">/</span>
      <a href="nieuws.html">Nieuws</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current" id="breadcrumbName"></span>
    </nav>

    <div class="post-date" id="postDate"></div>
    <h1 class="post-title t-heading-lg" id="postTitle"></h1>
    <img class="post-hero-img" id="postImg" src="" alt="" style="display:none;">
    <div class="post-content" id="postContent"></div>

    <div id="relatedPosts" style="display:none;margin-top:56px;">
      <h2 class="t-heading-md" style="margin-bottom:20px;" data-i18n="blog.related">Lees ook</h2>
      <div id="relatedPostsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;"></div>
    </div>

    <div class="post-cta">
      <p style="font-size:17px;font-weight:600;color:var(--dark-1);margin-bottom:16px;">Wil jij ook helpen?</p>
      <div class="post-cta-actions">
        <a href="honden.html" class="btn-secondary">Bekijk onze adoptiehonden</a>
        <a href="adoptie.html" class="btn-secondary">Een buitenlandse hond adopteren</a>
        <a href="doneer.html" class="btn-secondary">Steun met een donatie</a>
      </div>
    </div>

  </section>

  </main>
  <div id="footer-placeholder"></div>

  <script src="components.js?v=43"></script>
  <script src="supabase-config.js"></script>
  <script src="blog-normalize.js?v=2"></script>
  <script>
    function formatDate(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      var months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    async function loadPost() {
      var params = new URLSearchParams(window.location.search);
      var postId = params.get('id');
      // Clean post URLs are /nieuws/<slug> (see .htaccess) — they carry no ?id=.
      // Fall back to the slug from the query string or the path, otherwise a slug-URL
      // visit hits showError() and paints "Bericht niet gevonden" on top of the
      // server-prerendered post (post.php resolves by slug).
      var slug = params.get('slug');
      if (!slug && !postId) {
        var m = window.location.pathname.match(/\/nieuws\/([A-Za-z0-9-]+)\/?$/);
        if (m) slug = m[1];
      }

      if (!postId && !slug) {
        showError();
        return;
      }

      try {
        var query = postId
          ? 'select=*&id=eq.' + encodeURIComponent(postId)
          : 'select=*&slug=eq.' + encodeURIComponent(slug);
        var posts = await supabaseGet('posts', query);

        if (!posts || posts.length === 0) {
          showError();
          return;
        }

        var post = posts[0];

        // Drafts (no published_at) and scheduled posts (future published_at) are not
        // publicly viewable. ?preview=1 bypasses this so an admin can review before it goes live.
        var isPreview = params.get('preview');
        var isLive = post.published_at && new Date(post.published_at) <= new Date();
        if (!isLive && !isPreview) {
          showError();
          return;
        }

        // Language-aware content (falls back to Dutch when a translation is missing).
        var title = h4dField(post, 'title') || '';
        var excerpt = h4dField(post, 'excerpt') || '';
        var content = h4dField(post, 'content') || '';

        document.title = title + ' — ' + (typeof h4dT === 'function' ? h4dT('nav.nieuws') : 'Nieuws') + ' | Hope for Dogs';
        var postDesc = excerpt ? excerpt.substring(0, 140) : content ? content.substring(0, 140) : 'Lees het laatste nieuws van Hope for Dogs.';
        // canonical/og:url/hreflang are already set correctly (language-prefixed, ?id=
        // preserved) by h4dInitSEOTags() at DOMContentLoaded — only override the fields
        // that depend on the fetched record.
        document.querySelector('meta[name="description"]').setAttribute('content', postDesc);
        document.querySelector('meta[property="og:title"]').setAttribute('content', title + ' — ' + (typeof h4dT === 'function' ? h4dT('nav.nieuws') : 'Nieuws') + ' | Hope for Dogs');
        document.querySelector('meta[property="og:description"]').setAttribute('content', postDesc);
        if (post.photo_url) {
          document.querySelector('meta[property="og:image"]').setAttribute('content', post.photo_url);
        }

        document.getElementById('postDate').textContent = formatDate(post.published_at || post.created_at);
        document.getElementById('postTitle').textContent = title;
        document.getElementById('breadcrumbName').textContent = title;

        // JSON-LD: BreadcrumbList schema (skip if the server prerender already injected it)
        if (!document.getElementById('ssr-ld-breadcrumb')) {
          var bcSchema = document.createElement('script');
          bcSchema.type = 'application/ld+json';
          bcSchema.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "BreadcrumbList",
            "itemListElement": [
              {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.hopefordogseurope.com/"},
              {"@type": "ListItem", "position": 2, "name": "Nieuws", "item": "https://www.hopefordogseurope.com/nieuws.html"},
              {"@type": "ListItem", "position": 3, "name": title}
            ]
          });
          document.head.appendChild(bcSchema);
        }
        var contentEl = document.getElementById('postContent');
        var rawContent = content || excerpt || '';
        var isHTML = /<[a-z][\s\S]*>/i.test(rawContent);
        if (isHTML) {
          contentEl.innerHTML = rawContent;
          if (window.h4dCleanBlog) window.h4dCleanBlog(contentEl);
        } else {
          contentEl.classList.add('plain-text');
          contentEl.textContent = rawContent;
        }

        if (post.photo_url) {
          var img = document.getElementById('postImg');
          img.src = post.photo_url;
          img.alt = title;
          img.style.display = 'block';
        }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('postSection').style.display = 'block';

        // JSON-LD: Article schema (skip if the server prerender already injected it)
        if (!document.getElementById('ssr-ld-article')) {
          var articleSchema = document.createElement('script');
          articleSchema.type = 'application/ld+json';
          articleSchema.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "BlogPosting",
            "headline": title,
            "datePublished": post.published_at || post.created_at,
            "image": post.photo_url || '',
            "author": {"@type": "Organization", "name": "Hope for Dogs"},
            "publisher": {"@type": "Organization", "name": "Hope for Dogs", "logo": {"@type": "ImageObject", "url": "https://www.hopefordogseurope.com/logo.png"}},
            "description": excerpt || (content ? content.substring(0, 160) : '')
          });
          document.head.appendChild(articleSchema);
        }

        loadRelatedPosts(post.id);

      } catch (err) {
        console.error('Error loading post:', err);
        showError();
      }
    }

    // Sibling internal links: show up to 3 other recent published posts. Non-critical
    // (wrapped so a failure never breaks the post). Funnels authority between posts.
    async function loadRelatedPosts(currentId) {
      try {
        var nowIso = new Date().toISOString();
        var posts = await supabaseGet('posts', 'select=id,slug,title,title_de,title_en,photo_url,published_at&published_at=lte.' + encodeURIComponent(nowIso) + '&order=published_at.desc&limit=5');
        if (!posts) return;
        var others = posts.filter(function (p) { return p.id !== currentId; }).slice(0, 4);
        if (!others.length) return;
        document.getElementById('relatedPostsGrid').innerHTML = others.map(function (p) {
          var t = h4dField(p, 'title') || 'Bericht';
          var safe = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
          var img = p.photo_url
            ? '<img src="' + p.photo_url + '" alt="' + safe + '" loading="lazy" width="400" height="225" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;">'
            : '';
          return '<a href="' + h4dDetailUrl('nieuws', 'post.html', p) + '" style="text-decoration:none;color:inherit;display:block;">' + img +
                 '<span style="display:block;margin-top:10px;font-weight:600;font-size:16px;color:var(--dark-1);line-height:1.35;">' + safe + '</span></a>';
        }).join('');
        document.getElementById('relatedPosts').style.display = 'block';
      } catch (e) { /* related posts are non-critical */ }
    }

    function showError() {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('errorScreen').style.display = 'flex';
    }

    loadPost();
  </script>
</body>
</html>
